<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencias Técnicas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg-primary: #14171b;
      --bg-surface: #1d2127;
      --accent: #1d6fe0;
      --text-main: #ffffff;
      --text-muted: #a0a5b0;
      --border: #2d323b;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }
    header {
      background-color: var(--bg-surface);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }
    .hidden { display: none !important; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-alta { background-color: #e53e3e; }
    .badge-media { background-color: #dd6b20; }
    .badge-baja { background-color: #3182ce; }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO (LOGIN) -->
  <div id="login-screen" class="container" style="margin-top: 100px; max-width: 400px;">
    <div class="card" style="text-align: center;">
      <h2>🛠 Asistencias Técnicas</h2>
      <p style="color: var(--text-muted);">Ingresá con tus credenciales para continuar.</p>
      <div class="form-group" style="text-align: left;">
        <label>Correo Electrónico</label>
        <input type="email" id="login-email" placeholder="ejemplo@correo.com">
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn" id="btn-login" style="width: 100%;">Ingresar</button>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="main-screen" class="hidden">
    <header>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 20px;">🛠</span>
        <strong>Asistencias Técnicas</strong>
      </div>
      <button class="btn btn-secondary" id="btn-logout">Salir</button>
    </header>

    <div class="container">
      
      <!-- BUSCADOR GLOBAL (Para Administradores y Técnicos) -->
      <div class="card">
        <h3>🔍 Buscador Global de Clientes</h3>
        <div class="form-group">
          <input type="text" id="search-input" placeholder="Buscar por nombre, ID o dirección...">
        </div>
        <div id="search-results" style="margin-top: 15px; max-height: 250px; overflow-y: auto;">
          <!-- Se completa mediante JS -->
        </div>
      </div>

      <!-- SECCIÓN DE ADMINISTRADOR: SINCRONIZACIÓN Y EXPORTACIÓN -->
      <div id="admin-actions" class="card hidden">
        <h3>⚙️ Herramientas de Administrador</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <button class="btn" id="btn-sync-wispro">🔄 Sincronizar desde Wispro API</button>
          <button class="btn btn-secondary" id="btn-download-json">Descargar CSV Wispro</button>
        </div>
      </div>

      <!-- FORMULARIO DE NUEVO DESPACHO -->
      <div class="card">
        <h3>📋 Nueva Asistencia (Despacho)</h3>
        <form id="form-asistencia">
          <div class="form-group">
            <label>Cliente / Titular</label>
            <input type="text" id="asistencia-cliente" required placeholder="Nombre completo del cliente">
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>Teléfono</label>
              <input type="text" id="asistencia-tel" placeholder="Ej: 1123456789">
            </div>
            <div class="form-group">
              <label>Plan Actual</label>
              <input type="text" id="asistencia-plan" placeholder="Ej: Fibra 100 Megas">
            </div>
          </div>

          <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="asistencia-dir" required placeholder="Calle, Número, Localidad">
          </div>

          <!-- CAMPO SOLICITADO: ENLACE DEL TICKET -->
          <div class="form-group">
            <label>🔗 Enlace / Link del Ticket de Soporte</label>
            <input type="url" id="asistencia-ticket-link" placeholder="https://ejemplo.com">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>Prioridad</label>
              <select id="asistencia-prioridad">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="form-group">
              <label>Asignar Técnico</label>
              <select id="asistencia-tecnico">
                <option value="">Seleccionar (Opcional)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn" style="width: 100%;">Crear y asignar asistencia</button>
        </form>
      </div>

      <!-- HISTORIAL DE TAREAS -->
      <div class="card">
        <h3>📋 Historial de Tareas Realizadas y Pendientes</h3>
        <div id="tasks-list">
          <p style="color: var(--text-muted);">Cargando registros...</p>
        </div>
      </div>

    </div>
  </div>

  <!-- INYECTOR ESTABLE COMPAT DE SDK FIREBASE -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    // Parámetros de conexión a la base de datos de tu proyecto 'ticket-fcce5'
    const firebaseConfig = {
      apiKey: "AIzaSyBz8UMEOOZ9n6unW-n_xXlnBv1XqdWVDfU",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "ticket-fcce5",
      storageBucket: "ticket-fcce5.firebasestorage.app",
      messagingSenderId: "597575091640",
      appId: "1:597575091640:web:b9983ab747f3538605bb4d",
      measurementId: "G-VGC2QT7Z69"
    };

    // Inicialización de servicios
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let usuarioActual = null;
    let datosWisproCache = [];
    const FUNCION_WISPRO_URL = "https://run.app";

    // 1. GESTIÓN DE SESIÓN DE USUARIOS
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userDoc = await db.collection("usuarios").doc(user.uid).get();
          
          if (userDoc.exists) {
            usuarioActual = { uid: user.uid, ...userDoc.data() };
            
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-screen").classList.remove("hidden");
            
            // Habilitar herramientas Wispro si el rol es administrador
            if (usuarioActual.rol === 'admin') {
              document.getElementById("admin-actions").classList.remove("hidden");
            } else {
              document.getElementById("admin-actions").classList.add("hidden");
            }
            
            cargarHistorialTareas();
            cargarListaTecnicos();
          } else {
            alert("Acceso denegado: Tu ID de autenticación no está indexado en la colección 'usuarios'.");
            auth.signOut();
          }
        } catch (err) {
          alert("Error de autenticación con la base de datos: " + err.message);
          auth.signOut();
        }
      } else {
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("main-screen").classList.add("hidden");
        document.getElementById("admin-actions").classList.add("hidden");
        usuarioActual = null;
      }
    });

    // Acción del botón Login
    document.getElementById("btn-login").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;

      if (!email || !pass) {
        alert("Campos obligatorios vacíos.");
        return;
      }

      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        console.error(err);
        alert("Usuario o contraseña incorrectos.");
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => auth.signOut());
