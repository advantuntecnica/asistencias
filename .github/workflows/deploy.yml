name: Deploy to Firebase Functions on Push
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd functions
          npm install

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          # CORRECCIÓN: Se quitó el 'firebase' inicial en el primer comando para evitar la redundancia
          args: functions:secrets:set WISPRO_TOKEN="${{ secrets.WISPRO_TOKEN }}" --project ticket-fcce5 && firebase deploy --only functions --project ticket-fcce5
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_FCCE5 }}
