name: Deploy to Firebase Functions on Push
on:
  push:
    branches:
      - main # Cambiá por 'master' si tu rama principal se llama así
    paths:
      - 'functions/**' # Solo se activa si modificás algo dentro de la carpeta del backend

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # La versión nativa que requiere Firebase v2

      - name: Install Dependencies
        run: |
          cd functions
          npm ci || npm install

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_FCCE5 }}
